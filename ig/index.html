<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Pras</title>
    <style>
        body { 
            --bg-image: url('bgtanjiro.jpg');
            background: linear-gradient(rgba(10,10,20,0.6), rgba(10,10,20,0.7)),
                        var(--bg-image) center/cover no-repeat fixed;
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; margin: 0; 
            display: flex; flex-direction: column; align-items: center; 
            padding: 40px 20px;
            transition: background 0.6s ease;
        }

        /* --- Foto Profil --- */
        .profile-container { position: relative; margin-bottom: 20px; }
        .profile-pic { 
            width: 110px; height: 110px; border-radius: 50%; 
            object-fit: cover; border: 3px solid transparent;
            /* Efek glowing biru neon */
            box-shadow: 0 0 15px #00e5ff, 0 0 30px #00e5ff;
        }
        .username { font-size: 1.2em; font-weight: bold; margin: 10px 0 5px; }
        .bio { font-size: 0.9em; color: #bbb; margin-bottom: 30px; }

        /* --- BAGIAN MUSIK KOTAK / PLAYER BARU --- */
        .music-player {
            width: min(90vw, 360px);
            margin-bottom: 30px;
        }

        .music-card {
            background: rgba(14, 18, 34, 0.75);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 24px;
            box-shadow: 0 18px 40px rgba(0,0,0,0.35), 0 0 22px rgba(0, 229, 255, 0.15);
            padding: 18px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .music-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 22px 50px rgba(0,0,0,0.4), 0 0 28px rgba(255, 0, 255, 0.15);
        }

        .album-art {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            display: block;
            border-radius: 18px;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.18);
            border: 1px solid rgba(255,255,255,0.12);
        }

        .song-meta {
            margin-top: 16px;
            text-align: left;
        }

        .song-title {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
        }

        .song-artist {
            margin: 6px 0 14px;
            font-size: 0.8rem;
            color: #b9d3ff;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #dfeaff;
            margin-bottom: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 7px;
            border-radius: 999px;
            background: rgba(255,255,255,0.12);
            overflow: hidden;
        }

        .progress-fill {
            display: block;
            height: 100%;
            width: 0%;
            border-radius: inherit;
            background: linear-gradient(90deg, #00e5ff, #ff00ff);
            box-shadow: 0 0 14px rgba(0, 229, 255, 0.6);
            transition: width 0.2s linear;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 18px;
        }

        .control-btn {
            width: 52px;
            height: 52px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #00e5ff, #ff00ff);
            color: #09111d;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 18px rgba(0, 229, 255, 0.45);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .control-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.5);
        }

        .switch-btn {
            width: 42px;
            height: 42px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .switch-btn:hover {
            background: rgba(255,255,255,0.1);
            transform: scale(1.04);
        }

        .next-tab-btn {
            margin-top: 16px;
            padding: 10px 18px;
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 999px;
            background: rgba(255,255,255,0.08);
            color: white;
            font: inherit;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .next-tab-btn:hover {
            background: rgba(255,255,255,0.16);
            transform: translateY(-2px);
        }


        /* --- TOMBOL-TOMBOL SOSIAL --- */
        .btn { 
            display: inline-flex; align-items: center; justify-content: center;
            width: 52px; height: 52px; padding: 0; margin: 12px 10px; 
            background: rgba(255,255,255,0.04); text-decoration: none; border: 1px solid rgba(255,255,255,0.12); border-radius: 50%;
            overflow: hidden; transition: 0.3s; box-sizing: border-box;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .btn:hover { transform: translateY(-2px) scale(1.06); box-shadow: 0 12px 25px rgba(0,0,0,0.28); }

        .btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 50%;
        }

        .socials {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 10px;
            gap: 4px;
        }

        /* Layar Pembuka (Overlay) */
        #masuk-layar { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.88); display: flex; align-items: center; 
            justify-content: center; z-index: 1000; cursor: pointer; color: white;
            flex-direction: column;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        #masuk-layar h2 {
            margin: 0 0 8px;
            font-size: clamp(1.4rem, 4vw, 2.2rem);
            letter-spacing: 0.06em;
        }

        #masuk-layar p {
            margin: 0;
            color: #dfeaff;
            letter-spacing: 0.08em;
            text-transform: lowercase;
        }
    </style>
</head>
<body>

    <div id="masuk-layar" onclick="mulaiWebsite()">
        <h2> hayyy </h2>
        <p>Tap untuk lanjudd</p>
    </div>

    <audio id="bg-lagu" loop>
        <source src="Lagu.mp3" type="audio/mpeg">
    </audio>

    <div class="profile-container">
        <img src="profil1.png" alt="Foto Profil" class="profile-pic">
    </div>
    <div class="username">@Prazzz404</div>
    <div class="bio">PDD /  XI TJKT 1 / Introvert </div>

    <div class="music-player" id="player-container">
        <div class="music-card">
            <img src="fotoalbum.png" alt="Album cover" class="album-art" id="album-art">
            <div class="song-meta">
                <p class="song-title" id="song-title">Bergema Sampai Selamanya</p>
                <p class="song-artist" id="song-artist">Nadif Basalamah</p>

                <div class="time-row">
                    <span id="current-time">0:00</span>
                    <span id="total-time">0:00</span>
                </div>

                <div class="progress-bar">
                    <span class="progress-fill" id="progress-fill"></span>
                </div>

                <div class="controls">
                    <button class="switch-btn" id="prev-btn" aria-label="Previous song">⏮</button>
                    <button class="control-btn" id="play-btn" aria-label="Play or pause music">▶</button>
                    <button class="switch-btn" id="next-btn" aria-label="Next song">⏭</button>
                </div>
            </div>
        </div>
    </div>

    <div class="socials">
        <a href="https://steamcommunity.com/profiles/76561198694489543/" class="btn" target="_blank" aria-label="Steam profile">
            <img src="steamicon.PNG" alt="Steam">
        </a>
        <a href="http://discordapp.com/users/1176139362744934480" class="btn" target="_blank" aria-label="Discord profile">
            <img src="discordicon1.PNG" alt="Discord">
        </a>
        <a href="https://www.instagram.com/prasss404?igsi=emRka2xqMjJlNHQy" class="btn" target="_blank" aria-label="Instagram profile">
            <img src="igicon.png" alt="Instagram">
        </a>
        <a href="http://tiktok.com/@gungprstyoo" class="btn" target="_blank" aria-label="TikTok profile">
            <img src="tticon.png" alt="TikTok">
        </a>
        <a href="https://www.roblox.com/share?code=d930c4fa75cabf4f96081481766f8edc&type=Profile&source=ProfileShare&stamp=1788587162988" class="btn" target="_blank" aria-label="Roblox profile">
            <img src="robloxicon.png" alt="Roblox">
        </a>
    </div>
    <button class="next-tab-btn" id="next-tab-btn" type="button">Tab Selanjutnya</button>

    <script>
        const lagu = document.getElementById('bg-lagu');
        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const nextTabBtn = document.getElementById('next-tab-btn');
        const currentTimeEl = document.getElementById('current-time');
        const totalTimeEl = document.getElementById('total-time');
        const progressFill = document.getElementById('progress-fill');
        const titleEl = document.getElementById('song-title');
        const artistEl = document.getElementById('song-artist');
        const albumArtEl = document.getElementById('album-art');

        const tracks = [
            {
                title: 'Bergema Sampai Selamanya',
                artist: 'Nadif Basalamah',
                file: 'Lagu.mp3',
                cover: 'fotoalbum.png',
                background: 'bgtanjiro.jpg'
            },
            {
                title: 'Line Without Hook',
                artist: 'Ricky Montgomery',
                file: 'linewithouthook.mp3',
                cover: 'LinewithoutHook.jpg',
                background: 'linebg.png'
            }
        ];

        let currentTrack = 0;

        function formatTime(seconds) {
            if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${String(secs).padStart(2, '0')}`;
        }

        function updateProgress() {
            const current = lagu.currentTime || 0;
            const total = lagu.duration || 0;
            currentTimeEl.textContent = formatTime(current);
            totalTimeEl.textContent = formatTime(total);
            progressFill.style.width = total > 0 ? `${(current / total) * 100}%` : '0%';
        }

        function applyTrackInfo() {
            const track = tracks[currentTrack];
            titleEl.textContent = track.title;
            artistEl.textContent = track.artist;
            albumArtEl.src = track.cover;
            albumArtEl.alt = track.title;
            document.body.style.setProperty('--bg-image', `url('${track.background}')`);
            lagu.src = track.file;
            lagu.load();
            updateProgress();
        }

        function toggleMusic() {
            if (lagu.paused) {
                document.getElementById('masuk-layar').style.display = 'none';
                lagu.play();
            } else {
                lagu.pause();
            }
        }

        function switchTrack(direction) {
            currentTrack = (currentTrack + direction + tracks.length) % tracks.length;
            applyTrackInfo();
            if (!document.getElementById('masuk-layar').style.display || document.getElementById('masuk-layar').style.display !== 'none') {
                document.getElementById('masuk-layar').style.display = 'none';
            }
            lagu.play();
        }

        function mulaiWebsite() {
            document.getElementById('masuk-layar').style.display = 'none';
            if (lagu.paused) {
                lagu.play();
            }
        }

        playBtn.addEventListener('click', toggleMusic);
        prevBtn.addEventListener('click', () => switchTrack(-1));
        nextBtn.addEventListener('click', () => switchTrack(1));
        nextTabBtn.addEventListener('click', () => switchTrack(1));
        lagu.addEventListener('loadedmetadata', updateProgress);
        lagu.addEventListener('timeupdate', updateProgress);
        lagu.addEventListener('play', () => {
            playBtn.textContent = '⏸';
        });
        lagu.addEventListener('pause', () => {
            playBtn.textContent = '▶';
        });

        applyTrackInfo();
    </script>
</body>
</html>
